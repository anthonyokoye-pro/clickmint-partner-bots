name: Tests

# Runs the full offline test suite on every push and every pull request:
# engine + governance rules + BOT WIRING. This is your safety net: if a change
# breaks the logic — or breaks a bot's handlers/menus — GitHub flags it before it
# ever gets deployed. No secrets needed; every suite runs offline (the wiring
# tests drive real Telegram Update objects through a mocked session).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile-check all modules
        run: python -m py_compile *.py

      - name: Run core engine tests
        run: python test_core.py          # expect ALL TESTS PASSED (23)

      - name: Run governance tests
        run: python test_governance.py    # expect 33/33

      - name: Run bot wiring tests
        run: python test_bots.py          # expect 24/24 (handlers, menus, funnel, roles)

      - name: Check branding copy against Telegram's limits
        run: python branding.py --check
