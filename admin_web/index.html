<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClickMint Admin</title>
  <link rel="stylesheet" href="/admin_web/styles.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <header class="topbar"><div><span class="eyebrow">CLICKMINT</span><h1>Admin control room</h1></div><button id="refresh">Refresh</button></header>
    <p id="notice" class="notice">Authenticating with Telegram…</p>
    <section id="summary" class="cards"></section>
    <section class="panel"><div class="panel-head"><h2>Connected destinations</h2></div><div id="channels" class="list"></div></section>
    <section class="panel"><div class="panel-head"><h2>Recommended tasks</h2><select id="category"><option value="">All categories</option></select></div><div id="tasks" class="list"></div></section>
    <section class="panel"><div class="panel-head"><h2>Broadcast campaigns</h2><select id="broadcast-status"><option value="">All statuses</option><option>queued</option><option>running</option><option>paused</option><option>completed</option><option>cancelled</option></select></div><div class="compose"><input id="broadcast-title" maxlength="160" placeholder="Campaign title"><textarea id="broadcast-text" maxlength="4000" placeholder="Approved Reward broadcast text"></textarea><input id="broadcast-scheduled" type="datetime-local"><button id="create-broadcast">Create draft</button></div><div id="broadcasts" class="list"></div></section>
    <section class="panel"><div class="panel-head"><h2>Performance history</h2></div><div id="performance" class="list"></div></section>
    <section class="panel"><div class="panel-head"><h2>Referral ranking</h2><input id="period" placeholder="YYYY-MM" value=""></div><div id="referrals" class="list"></div></section>
    <section class="panel"><div class="panel-head"><h2>Recent audit events</h2><select id="audit-type"><option value="channel">Channel</option><option value="admin_security">Security</option><option value="outbox">Outbox</option><option value="admin_request">API requests</option></select></div><div id="audit" class="list"></div></section>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/admin_web/app.js"></script>
</body>
</html>
